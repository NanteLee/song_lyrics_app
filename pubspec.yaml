name: song_lyrics_app
description: Identify songs from the microphone and show synced lyrics using the AudD API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Minimum external dependencies used by this app ---
  http: ^1.2.0                 # calling the AudD REST API
  record: ^5.1.2                # recording short audio clips from the mic
  permission_handler: ^11.3.1   # requesting RECORD_AUDIO permission at runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
